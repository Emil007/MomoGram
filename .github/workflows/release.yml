# Builds every release target and publishes a GitHub release.
#  * push to main with a new "version" in package.json -> release v<version> (the tag is created here)
#  * push of a tag v1.2.3                               -> release for that tag
#  * manual run (workflow_dispatch)                     -> artifacts only, no release
# No game data is included anywhere: players add the games they own inside the app.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package web version
        run: |
          mkdir -p out
          cp -r dist/web momogram-web
          find momogram-web -name '*.map' -delete
          cp README.md LICENSE momogram-web/
          zip -qr out/MomoGram-${{ needs.version.outputs.version }}-web.zip momogram-web
          # the server for your own web space (PHP + MySQL/SQLite)
          cp -r server momogram-server && zip -qr out/MomoGram-${{ needs.version.outputs.version }}-server.zip momogram-server
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz --x64 --arm64
          - os: windows-latest
            args: --win zip nsis --x64 --arm64 -c.win.signAndEditExecutable=true
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Copy the web build into the desktop app
        shell: bash
        run: rm -rf electron/web && cp -r dist/web electron/web && find electron/web -name '*.map' -delete
      - name: Install Electron tooling
        working-directory: electron
        run: npm install
      - name: Build
        working-directory: electron
        shell: bash
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
            dist/desktop/*.dmg

  android:
    # the web version wrapped with Capacitor, signed with MomoGram's own key (secrets ANDROID_KEYSTORE, base64, and
    # ANDROID_KEY_PASSWORD), so every release installs over the previous one. Without the secrets: debug-signed.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V=${{ needs.version.outputs.version }}
          mkdir -p out android-app
          cd android-app
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          cp -r ../dist/web www && find www -name '*.map' -delete
          npx cap init MomoGram io.github.emil007.momogram --web-dir www
          npx cap add android
          # MomoGram icon instead of the Capacitor default
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp ../electron/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png; cp ../electron/icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cd android
          sed -i "s/versionName \".*\"/versionName \"$V\"/" app/build.gradle
          # Android only installs updates with a higher versionCode: 1.2.3 -> 10203
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          sed -i "s/versionCode [0-9]*/versionCode $((MA * 10000 + MI * 100 + PA))/" app/build.gradle
          ./gradlew assembleDebug --no-daemon -q
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks release.jks --ks-key-alias momogram --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out signed.apk "$APK"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify signed.apk
            APK=signed.apk; rm release.jks
          else
            echo "::warning::ANDROID_KEYSTORE secret missing: the APK is debug-signed and won't install over earlier versions"
          fi
          cp "$APK" ../../out/MomoGram-$V-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  release:
    if: always() && needs.version.outputs.release == 'true' && needs.web.result == 'success' && needs.desktop.result == 'success'
    needs: [version, web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MomoGram ${{ needs.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Downloads:** Windows (`Windows-x64` / `Windows-arm64` zip, or the setup `.exe`), macOS (`mac-arm64` / `mac-x64` dmg), Linux / Steam Deck (`Linux` AppImage or tar.gz, x64 and arm64), Android (`Android.apk`), web version (`web.zip`, or play at https://emil007.github.io/MomoGram/).
            No game data is included: try the starter puzzles, then add the nonogram games you own (DS, 3DS, Game Boy, Super Famicom …) inside the app. See the README.
